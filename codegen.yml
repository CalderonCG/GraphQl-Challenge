schema: "https://rickandmortyapi.com/graphql"
documents: "src/queries/**/*.ts"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      # 🔑 Esto evita que te aparezca `?` en todos lados
      avoidOptionals:
        field: true      # los campos no null del schema → obligatorios
        inputValue: false
        object: true
      # 🔑 Ajusta cómo se generan valores nulos
      maybeValue: T | null
      # 🔑 Opcional: fuerza arrays no nulos si el schema los marca así
      arrayInputCoercion: false
      # 🔑 Opcional: agrega __typename siempre
      nonOptionalTypename: true
      